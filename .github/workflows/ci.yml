name: CI

on:
  push:
    branches: [main, master, feat/tauri-v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 所有门禁与打包都走本仓库 flake（flake.lock 锁定），保证 CI 与本地
# （mac / NixOS）的 rustc / node / 系统库完全同源，消灭版本漂移：
# 之前 setup-node@22 + dtolnay stable 与本地 node 24 / rustc 1.98 不一致。
jobs:
  gate:
    name: Gate（flake 环境：前端 + Rust 门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Restore /nix/store cache
        uses: actions/cache/v4
        with:
          path: /nix/store
          key: nix-store-x86_64-linux-${{ hashFiles('flake.lock') }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            nix-store-x86_64-linux-${{ hashFiles('flake.lock') }}-
            nix-store-x86_64-linux-

      - name: Restore cargo target
        uses: actions/cache/v4
        with:
          path: src-tauri/target
          key: cargo-target-x86_64-linux-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Restore npm cache
        uses: actions/cache/v4
        with:
          path: ~/.npm
          key: npm-x86_64-linux-${{ hashFiles('package-lock.json') }}

      - name: 前端（npm ci + typecheck + test + build）
        run: nix develop -c bash -c 'npm ci && npm run typecheck && npm run test && npm run build'

      - name: Rust（fmt + clippy + test）
        run: nix develop -c bash -c 'cd src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test'

  package:
    name: Package（nix build .#reelfs）
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Restore /nix/store cache
        uses: actions/cache/v4
        with:
          path: /nix/store
          key: nix-store-x86_64-linux-${{ hashFiles('flake.lock') }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            nix-store-x86_64-linux-${{ hashFiles('flake.lock') }}-
            nix-store-x86_64-linux-

      - name: Build Reelfs（x86_64-linux，前端 dist + Tauri 打包）
        run: nix build -L .#reelfs

      - name: Flake check（全部系统求值）
        run: nix flake check --no-build --all-systems
